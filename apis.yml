name: Coho Data
description: >-
  Coho Data was a scale-out enterprise storage startup based in Sunnyvale,
  California, founded in 2011 (originally as Convergent.io) and backed by
  Andreessen Horowitz among others. It built a software-defined storage platform
  that combined commodity flash and software-defined networking to deliver
  scalable NFS/object storage for private clouds. The company ceased operations
  and wound down in 2017. It was surfaced as an a16z portfolio company and added
  to the API Evangelist network as a stub. It is defunct: it operates no live
  developer portal, documentation, or API, and the cohodata.com domain has since
  lapsed to a third-party parked/content-farm site unrelated to the original
  company, so there is no public API surface to enrich.
